<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGL Dashboard</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4ede2">
<link rel="icon" type="image/png" href="favicon.png">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
/* Palet 4 - Cream / Powder Blue / Soft Peach / Taupe / Deep Rosewood */
--bg:#f4ede2;--bar:#faf6ef;--card:#fffcf7;--field:#f6efe5;--line:#e8dccd;--line2:#d2c1ac;--text:#46392f;--mu:#7b6d62;--acc:#b8584a;--chip:#efe4d6;--hov:#f1e7da;--thbg:#f0e6d9;--track:#ebe0d2;--rng:#dde8f0;--sel:#b8584a;--selt:#fff;--up:#26815a;--dn:#bd3f3a;
--sh:0 2px 10px rgba(120,90,60,.08);--shl:0 14px 40px rgba(90,65,40,.22);--scrim:rgba(70,50,35,.38);--blob1:rgba(185,207,222,.55);--blob2:rgba(246,205,178,.45);
--c1:#f0ae8c;--c2:#8fb3cd;--c3:#b9a595;--c4:#c4695b;--c5:#dcc79f;--c6:#5f89a8;
--sbbg:#bcd0de;--sbtext:#2c4150;--sbhov:rgba(255,255,255,.42);--sbon:#fffcf7;--sbchip:rgba(255,255,255,.55);--sbchipon:rgba(188,208,222,.6);--sblogo:#fffcf7;--swoff:rgba(44,65,80,.3)}
:root[data-theme=dark]{color-scheme:dark;
--bg:#151a20;--bar:#1b222a;--card:#202931;--field:#192028;--line:#2e3a45;--line2:#475662;--text:#efe7dd;--mu:#9ea9b3;--acc:#eaa88d;--chip:#2b3640;--hov:#2a3540;--thbg:#26313b;--track:#2d3944;--rng:#2c4156;--sel:#eaa88d;--selt:#2a1a12;--up:#5fd3a0;--dn:#f08585;
--sh:0 2px 12px rgba(0,0,0,.28);--shl:0 14px 40px rgba(0,0,0,.55);--scrim:rgba(0,0,0,.6);--blob1:rgba(95,137,168,.16);--blob2:rgba(234,168,141,.09);
--c1:#eaa98b;--c2:#86abc6;--c3:#bba797;--c4:#da7a6d;--c5:#d9c3a0;--c6:#6f9fc0;
--sbbg:#22313f;--sbtext:#e4ecf3;--sbhov:rgba(255,255,255,.07);--sbon:#344a5f;--sbchip:rgba(255,255,255,.08);--sbchipon:rgba(255,255,255,.13);--sblogo:#1b222a;--swoff:rgba(255,255,255,.22)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
body{margin:0;background:radial-gradient(700px 480px at 100% 0,var(--blob1),transparent 70%),radial-gradient(620px 460px at 0 100%,var(--blob2),transparent 70%),var(--bg);background-attachment:fixed;color:var(--text);font:15px/1.45 ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);border-bottom:1px solid var(--line);box-shadow:var(--sh);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:8px calc(max(0px,(100% - 1100px)/2) + 12px)}
button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 12px;cursor:pointer;box-shadow:var(--sh)}
button:hover{border-color:var(--line2);background:var(--hov)}
.pri{background:var(--acc);color:var(--selt);border-color:var(--acc);font-weight:600}
#burger{justify-self:start;width:40px;height:40px;display:grid;place-items:center;padding:0;border-radius:12px;flex:none}
.ttl{font-weight:700;font-size:18px;white-space:nowrap}.ttl b{color:var(--acc)}
#per{justify-self:end;text-align:left;padding:5px 10px;line-height:1.25;display:flex;align-items:center;gap:8px}#per .ic{margin:0;width:20px;height:20px}
@media(max-width:640px){#per .txt{display:none}#per{width:40px;height:40px;padding:0;justify-content:center;border-radius:12px}}
#per small{display:block;color:var(--mu);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
#per span{font-size:12px;font-weight:600;white-space:nowrap}
#pop{display:none;position:absolute;top:calc(100% + 6px);right:calc(max(0px,(100% - 1100px)/2) + 12px);width:min(330px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shl)}
#pop.show{display:block}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 4px}
input{width:100%;font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
input:focus-visible{outline:none;border-color:var(--c2);box-shadow:0 0 0 3px color-mix(in srgb,var(--c2) 30%,transparent)}
input::placeholder{color:var(--mu);opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{padding:4px 10px;font-size:12px;border-radius:99px;box-shadow:none}
.cal{margin-top:12px}.cal .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600}.cal .hd button{padding:2px 12px;box-shadow:none}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cal .g span{font-size:11px;color:var(--mu);padding:4px 0}
.cal .g button{border:0;background:none;border-radius:10px;padding:8px 0;font-size:13px;box-shadow:none}.cal .g button:hover{background:var(--hov)}
.cal .g .in{background:var(--rng);border-radius:0}.cal .g .ed,.cal .g .ed:hover{background:var(--sel);color:var(--selt);font-weight:700;border-radius:10px}.cal .g .td{box-shadow:inset 0 0 0 1px var(--mu)}
.cal .hint{font-size:12px;color:var(--mu);margin-top:8px;text-align:center}
.sb{cursor:pointer;user-select:none}.sb:hover{color:var(--acc)}
td.up{color:var(--up)}td.dn{color:var(--dn)}
.ic{display:inline-block;vertical-align:-4px;margin-right:8px;color:inherit;flex:none}
h1 .ic,h2 .ic,.sech .ic{padding:7px;border-radius:12px;background:var(--chip);margin:0 10px 0 0}
h1 .ic{width:38px;height:38px}h2 .ic,.sech .ic{width:32px;height:32px;padding:6px;border-radius:10px}
#drawer a .ic{margin-right:12px}
.info{font-size:14px;line-height:1.5}.calc label{font-size:13px;margin:0 0 6px}.calc label b{font-weight:400;margin-left:6px}
.fld{display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:0 12px}.fld:focus-within{border-color:var(--c2)}.fld.off{opacity:.45}
.fld input{width:auto;flex:1;min-width:0;border:0;background:none;padding:12px 0;font-size:18px;outline:none;box-shadow:none}.fld i{font-style:normal;color:var(--mu)}.fld span{color:var(--mu);font-size:13px}
.or{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px;letter-spacing:.08em;margin:14px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
#cv{font-size:26px}
.fld .clr{display:flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;border:0;background:var(--chip);color:var(--text);border-radius:50%;flex:none;box-shadow:none}.fld .clr:hover{background:var(--line2);color:var(--text)}.fld .clr[hidden]{display:none}.clr .ic{margin:0;width:14px;height:14px;padding:0;background:none}
.sech{display:flex;align-items:center;gap:0;width:100%;padding:0;border:0;background:none;color:var(--text);font:inherit;text-align:left;cursor:pointer;box-shadow:none}.sech:hover{background:none}.sech .tt{flex:1;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.chev{display:inline-flex;transition:transform .2s}.sech[aria-expanded=true] .chev{transform:rotate(180deg)}.chev .ic{width:20px;height:20px;padding:0;background:none;margin:0}
.logo{display:block;height:38px;width:auto}.home{display:block;line-height:0}
@media(max-width:380px){header .logo{height:32px}}
#drawer{position:fixed;z-index:50;top:0;bottom:0;left:0;width:272px;max-width:82vw;background:var(--sbbg);color:var(--sbtext);border-radius:0 28px 28px 0;transform:translateX(-102%);transition:transform .2s;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column}
#drawer.open{transform:none;box-shadow:var(--shl)}
#drawer .logo{height:72px;width:auto;max-width:100%;padding:10px 14px;margin:0 0 18px;background:var(--sblogo);border-radius:20px;box-shadow:var(--sh)}
#drawer h3{margin:0 8px 14px;font-size:18px}#drawer h3 b{color:var(--acc)}
#drawer a{display:flex;align-items:center;padding:9px 10px;border-radius:18px;color:var(--sbtext);text-decoration:none;margin-bottom:6px;font-weight:500}
#drawer a .ic,#theme .ic{width:36px;height:36px;padding:8px;margin:0 12px 0 0;border-radius:13px;background:var(--sbchip)}
#drawer a:hover{background:var(--sbhov)}#drawer a.on{background:var(--sbon);color:var(--sbtext);font-weight:700;box-shadow:var(--sh)}
#drawer a.on .ic{background:var(--sbchipon)}
#theme{margin-top:auto;display:flex;align-items:center;width:100%;padding:9px 10px;border:0;border-radius:18px;background:var(--sbhov);color:var(--sbtext);box-shadow:none;text-align:left}
#theme:hover{background:var(--sbon)}
#theme .tl{flex:1;font-weight:500}
#theme .sw{position:relative;flex:none;width:44px;height:26px;border-radius:99px;background:var(--swoff);transition:background-color .2s}
#theme .sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .2s}
#theme[aria-checked=true] .sw{background:var(--c2)}#theme[aria-checked=true] .sw i{transform:translateX(18px)}
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.show{opacity:1;pointer-events:auto}
.wrap{max-width:1100px;margin:0 auto;padding:14px 12px 36px}
h1{display:flex;align-items:center;font-size:22px;letter-spacing:-.01em;margin:2px 0 14px}h2{display:flex;align-items:center;font-size:15px;margin:0 0 12px}
#status{display:none;margin-bottom:12px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--acc);font-size:14px}#status.show{display:block}
.grid{display:grid;gap:12px;margin-bottom:12px}.kp{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:minmax(0,1fr)}
@media(min-width:720px){.kp{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ttl{font-size:20px}}
.kp.k2{grid-template-columns:repeat(2,1fr)}
.kp.k4{grid-template-columns:repeat(2,1fr)}@media(min-width:720px){.kp.k4{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}.grid .card{margin:0}.grid>*{min-width:0}
.kpi{position:relative;overflow:hidden;padding-left:20px}.kpi::before{content:"";position:absolute;left:0;top:22px;bottom:22px;width:5px;border-radius:0 6px 6px 0;background:var(--c1)}
.kp>.kpi:nth-child(4n+2)::before{background:var(--c2)}.kp>.kpi:nth-child(4n+3)::before{background:var(--c3)}.kp>.kpi:nth-child(4n+4)::before{background:var(--c4)}
.kpi .l{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.kpi .v{font-size:21px;font-weight:700;letter-spacing:-.01em;margin-top:3px}.kpi .n{color:var(--mu);font-size:12px}@media(max-width:480px){.kpi{padding-left:18px}.kpi .v{font-size:18px}}.kpi .v.up{color:var(--up)}.kpi .v.dn{color:var(--dn)}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mu);margin-bottom:6px}
.lg i,.li i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.li{margin:5px 0;font-size:13px}.mu{color:var(--mu)}
svg{display:block}svg text{fill:var(--mu);font-size:11px}.ax{stroke:var(--line);stroke-dasharray:3 4}
.scroll svg rect{rx:4px}
.hb{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.hb .bar{height:12px;border-radius:6px;background:var(--track);overflow:hidden}.hb .bar b{display:block;height:100%;background:var(--acc);border-radius:6px}
.hb .val{color:var(--mu);font-variant-numeric:tabular-nums}
.don{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.scroll{overflow:auto}.tall{max-height:64vh}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--text);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--thbg);z-index:1}
.r{text-align:right;font-variant-numeric:tabular-nums}.note{white-space:normal;min-width:150px}
.st td:first-child,.st th:first-child{position:sticky;left:0;background:var(--card)}.st th:first-child{z-index:2;background:var(--thbg)}
tbody tr:hover td,tbody tr:hover td:first-child{background:var(--hov)}
tfoot td{font-weight:700;border-top:2px solid var(--line2);border-bottom:0}
.empty{color:var(--mu);padding:22px 0;text-align:center}
footer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--mu);font-size:12px;margin-top:8px}
.th{display:flex;flex-wrap:wrap;gap:10px}.th figure{margin:0;display:flex;flex-direction:column;gap:6px;width:84px;font-size:11px;color:var(--mu);text-align:center}.th img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.th button{padding:3px 6px;font-size:11px;box-shadow:none}
.rev td{padding:5px 4px}.rev input{padding:6px 8px;font-size:13px;border-radius:10px;width:auto}.rev .r{white-space:normal}.wn{color:var(--dn);font-size:13px}button:disabled{opacity:.5;cursor:default}#upb label{margin-top:12px}#upb label:first-child{margin-top:0}
.pwm{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45)}.pwm.show{display:flex}.pwm .card{width:100%;max-width:340px;margin:0}
#cal{touch-action:pan-y}.kp.k2.stk{align-items:start}@media(max-width:719px){.kp.k2.stk{grid-template-columns:1fr}}
.edbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.edtog{display:inline-flex;align-items:center}.edtog .ic{width:16px;height:16px;margin:0 6px 0 0;vertical-align:0}.edtog.on{background:var(--acc);color:var(--selt);border-color:var(--acc)}
tr.er{cursor:pointer}.epen{color:var(--acc);margin-right:6px;font-size:12px}
.edm{position:fixed;inset:0;z-index:85;display:none;align-items:center;justify-content:center;padding:16px;background:var(--scrim)}.edm.show{display:flex}.edm .card{width:100%;max-width:520px;max-height:92vh;overflow:auto;margin:0}
.edg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.edf{min-width:0}.edf.w{grid-column:1/-1}.edh{font-size:11px;color:var(--mu);margin-top:3px;min-height:14px}
.lnk{border:0;background:none;box-shadow:none;padding:0;color:var(--acc);font-size:11px;text-decoration:underline}.lnk:hover{background:none}
.dng{color:var(--dn);border-color:var(--dn)}#edmsg{margin-top:10px}#edfoot{margin-top:12px}
#edtoast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;z-index:90;transition:.2s}#edtoast.show{opacity:1;transform:translate(-50%,0)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.tabs button{border-radius:99px;padding:6px 16px;box-shadow:none}.tabs button.on{background:var(--acc);color:var(--selt);border-color:var(--acc);font-weight:600}
</style>
<script>try{if(localStorage.getItem("agl-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
</head>

const UP={fail:false,pin:'',tgl:iso(T),fs:[],st:'pilih',dr:null,hs:null,msg:'',busy:false,dup:false,ok:null,ars:''},GSR=google.script.run;

if(!UP.pin)UP.st='pin';

function upCall(fn,args,ok){GSR.withSuccessHandler(ok).withFailureHandler(e=>{UP.busy=false;UP.fail=true;UP.msg='Gagal menghubungi server: '+((e&&e.message)||e);upDraw()})[fn](...args)}
function upComp(f,mx,q){return createImageBitmap(f).then(b=>{const s=Math.min(1,mx/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)})}
function upAdd(L){UP.msg='';let p=Promise.resolve();
  L.forEach(f=>{p=p.then(()=>{if(UP.fs.length>=12){UP.msg='Maksimal 12 foto.';return}return upComp(f,1600,.78).then(u=>{UP.fs.push({f,url:u})},()=>{UP.msg='Foto "'+f.name+'" tidak bisa dibaca (format tidak didukung).'})})});
  return p.then(()=>UP.fs.reduce((a,x)=>a+x.url.length,0)>8e6?Promise.all(UP.fs.map(x=>upComp(x.f,1200,.7).then(u=>{x.url=u}))):0).then(upDraw)}
const upB64=x=>x.url.split(',')[1],upS=(L,k)=>L.reduce((a,r)=>a+(+r[k]||0),0);
function upDraw(){const b=$('upb');if(!b)return;const m=UP.msg?`<div class="wn" style="margin-top:10px">${esc(UP.msg)}</div>`:'';let h='';

  else if(UP.st==='pilih')h=`<div class="card"><label for="upd">Tanggal penjualan</label><input id="upd" type="date" value="${UP.tgl}"><label for="upf">Foto nota, screenshot QRIS, dan screenshot GrabFood (maks. 12)</label><input id="upf" type="file" accept="image/*" multiple><div class="th" style="margin-top:12px">${UP.fs.map((x,i)=>`<figure><img src="${x.url}" alt=""><button type="button" data-ua="rm" data-ui="${i}">Hapus</button></figure>`).join('')}</div><div style="margin-top:12px"><button type="button" class="pri" data-ua="run"${UP.busy||!UP.fs.length?' disabled':''}>${UP.busy?'Memproses…':'Baca foto'}</button>${UP.fail&&!UP.busy?' <button type="button" data-ua="manual">Isi manual (tanpa AI)</button>':''}</div>${UP.fail&&!UP.busy?'<div class="mu" style="margin-top:8px;font-size:12px">AI gagal membaca? Pilih Isi manual: ketik pesanan dari foto, lalu Simpan ke Sheet atau Salin untuk ditempel sendiri. Foto tetap di halaman ini.</div>':''}${m}</div>`;

  b.innerHTML=h;if(UP.st==='review')upTot()}
function upTot(){const h=UP.hs,it=UP.dr.items;if(!h||h.info.length!==it.length)return;
  h.info.forEach((f,i)=>{const c=$('ut'+i);if(!c)return;const k=String(f.dikenal);

  if(t.dataset.uk){const it=UP.dr.items[+t.dataset.ui],k=t.dataset.uk;it[k]=(k==='qty'||k==='total')?num(t.value):k==='kode'?t.value.trim().toUpperCase():t.value;if(k==='kode')t.value=it.kode;upSum()}});

  m.innerHTML='<div class="card"><h2>Masukkan Kata Sandi</h2><div class="mu" style="font-size:13px;margin-bottom:10px">Diperlukan untuk melihat Nett Profit.</div><input id="pwi" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><div id="pwe" class="wn" style="margin-top:8px"></div><div class="chips" style="margin-top:12px"><button type="button" class="pri" id="pwo">Buka</button><button type="button" id="pwx">Batal</button></div></div>';
  document.body.appendChild(m);let nx=null,busy=false;const i=$('pwi'),e=$('pwe'),ok=$('pwo'),close=()=>{m.classList.remove('show');nx=null};

      else e.textContent=String(r.pesan||'Gagal.').replace(/^PIN/,'Kata sandi').replace(/PIN/g,'kata sandi')}).withFailureHandler(()=>{busy=false;ok.disabled=false;e.textContent='Gagal menghubungi server. Coba lagi.'}).aglUploadMasuk(p)};
  ok.onclick=go;$('pwx').onclick=close;m.onclick=ev=>{if(ev.target===m)close()};i.onkeydown=ev=>{if(ev.key==='Enter')go()};
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape')close()});

    i.value='';e.textContent='';m.classList.add('show');setTimeout(()=>i.focus(),50)},true)})();

<script>
/* Edit / tambah / hapus baris: Keuangan & Detail Pesanan (server: Edit.gs) */
(function(){
const HR=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const FLD={
 fin:[{l:'Tanggal',ty:'date',w:1},{l:'Cash Start'},{l:'Cash End'},{l:'Cash Earnings',a:'ce'},{l:'QRIS'},{l:'GoFood'},{l:'GrabFood'},{l:'Total Omset',a:'tot',w:1},{l:'Note',ty:'text',w:1}],
 ord:[{l:'No.',ph:'otomatis'},{l:'Tanggal',ty:'date'},{l:'Hari',ty:'text',a:'hari'},{l:'Qty'},{l:'Kode Menu',ty:'text',ls:'edk'},{l:'Tipe Pesanan',ty:'text',ls:'edtp'},{l:'Keterangan Tambahan',ty:'text',w:1},{l:'Total (Rp)'},{l:'Catatan',ty:'text',w:1}]
};
const m=document.createElement('div');m.className='edm';m.id='edm';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');document.body.appendChild(m);
const tt=document.createElement('div');tt.id='edtoast';document.body.appendChild(tt);
let S=null,tm;
const toast=t=>{tt.textContent=t;tt.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>tt.classList.remove('show'),3200)};
const close=()=>{m.classList.remove('show');S=null};
const el=c=>$('ed'+c),val=c=>el(c).value,setV=(c,v)=>{el(c).value=v};
const vN=c=>{const s=val(c).trim();return s===''?null:num(s)};
const jn=()=>route()==='finance'?'fin':(TAB==='non'?'non':'ord');FLD.non=FLD.ord;

/* kata sandi (sama dengan halaman Upload Nota) */
function openPin(){
 m.innerHTML='<div class="card" style="max-width:340px"><h2>Masukkan Kata Sandi</h2><div class="mu" style="font-size:13px;margin-bottom:10px">Diperlukan untuk mengubah data.</div><input id="edpw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><div id="edpe" class="wn" style="margin-top:8px"></div><div class="chips" style="margin-top:12px"><button type="button" class="pri" data-eact="pinok">Buka</button><button type="button" data-eact="batal">Batal</button></div></div>';
 S={v:'pin',busy:false};m.classList.add('show');setTimeout(()=>$('edpw').focus(),50)}
function pinGo(){
 const p=$('edpw').value;if(!p||S.busy)return;S.busy=true;$('edpe').textContent='';
 google.script.run.withSuccessHandler(r=>{if(!S||S.v!=='pin')return;S.busy=false;
  if(r&&r.ok){UP.pin=p;if(UP.st==='pin')UP.st='pilih';try{sessionStorage.setItem('agl-pin',p)}catch(x){}EDIT=true;close();render()}
  else $('edpe').textContent=String((r&&r.pesan)||'Gagal.').replace(/^PIN/,'Kata sandi').replace(/PIN/g,'kata sandi')})
 .withFailureHandler(()=>{if(S){S.busy=false;$('edpe').textContent='Gagal menghubungi server. Coba lagi.'}}).aglUploadMasuk(p)}

/* form */
function openForm(aksi,row){
 const j=jn(),F=FLD[j],x=aksi==='ubah'?(j==='fin'?FIN:j==='non'?NON:ORD).find(o=>o.row===row):null;
 if(aksi==='ubah'&&!x)return;
 const asli=Array.from({length:9},(_,c)=>x?String(x.raw[c]==null?'':x.raw[c]):'');
 const init=F.map((f,c)=>{const r=asli[c];
  if(!x)return f.ty==='date'?iso(T):(j==='fin'&&c===5?'0':'');
  if(f.ty==='date'){const d=pd(r);return d?kiso(d.k):''}
  if(f.ty==='text')return r.trim();
  return r.trim()===''?'':String(num(r))});
 const n=c=>init[c]===''?null:+init[c],auto={};
 if(!x)auto.ce=auto.tot=auto.hari=true;
 else if(j==='fin'){
  auto.ce=init[3]===''||(n(1)!==null&&n(2)!==null&&n(3)===n(2)-n(1));
  auto.tot=init[7]===''||(n(3)!==null&&n(4)!==null&&n(6)!==null&&n(7)===n(3)+n(4)+(n(5)||0)+n(6))}
 else{const d=init[1]&&HR[new Date(init[1]+'T00:00').getDay()];auto.hari=init[2]===''||(!!d&&init[2].toLowerCase()===d.toLowerCase())}
 S={v:'form',j,aksi,row,asli,init,auto,busy:false,hapus:false,dup:false,msg:''};
 const kode=['NAGKG','NAKG','NAGB','NAGORI','NAG','AGKG','AGB','AGORI','AG'],tipe=['Dine In','Take Away','GrabFood','GoFood','-'];
 m.innerHTML=`<div class="card"><h2>${aksi==='ubah'?'Ubah':'Tambah'} ${j==='fin'?'Data Keuangan':j==='non'?'Pesanan Non-Ayam':'Pesanan'}</h2><div class="edg">${F.map((f,c)=>`<div class="edf${f.w?' w':''}"><label for="ed${c}">${f.l}</label><input id="ed${c}" type="${f.ty==='date'?'date':'text'}"${f.ty?'':' inputmode="numeric"'}${f.ls?` list="${f.ls}"`:''}${f.ph?` placeholder="${f.ph}"`:''} value="${esc(init[c])}" autocomplete="off">${f.a?`<div class="edh" id="edh${c}"></div>`:''}</div>`).join('')}</div><datalist id="edk">${kode.map(k=>`<option value="${k}">`).join('')}</datalist><datalist id="edtp">${tipe.map(k=>`<option value="${k}">`).join('')}</datalist><div id="edmsg" class="wn"></div><div id="edfoot"></div></div>`;
 m.classList.add('show');hints();paint()}

function hints(){FLD[S.j].forEach((f,c)=>{if(!f.a)return;const h=$('edh'+c);if(!h)return;
 h.innerHTML=S.auto[f.a]?(f.a==='tot'&&val(7).trim()===''?'Terisi otomatis setelah Cash Earnings, QRIS dan GrabFood ada':'Dihitung otomatis'):`<button type="button" class="lnk" data-eauto="${f.a}">↺ Hitung otomatis</button>`})}
function recalc(){
 if(S.j==='fin'){
  if(S.auto.ce){const a=vN(1),b=vN(2);setV(3,a!==null&&b!==null?String(b-a):'')}
  if(S.auto.tot){const ca=vN(3),q=vN(4),g=vN(6);setV(7,ca!==null&&q!==null&&g!==null?String(ca+q+(vN(5)||0)+g):'')}
 }else if(S.auto.hari){const t=val(1);setV(2,t?HR[new Date(t+'T00:00').getDay()]:'')}
 hints()}
function foot(){return S.hapus
 ?`<div class="wn" style="margin-bottom:10px">Hapus baris ini dari Google Sheet? Tindakan ini tidak bisa dibatalkan.</div><div class="chips"><button type="button" class="dng" data-eact="hapusya"${S.busy?' disabled':''}>${S.busy?'Menghapus…':'Ya, hapus'}</button><button type="button" data-eact="hapusno"${S.busy?' disabled':''}>Batal</button></div>`
 :`<div class="chips"><button type="button" class="pri" data-eact="simpan"${S.busy?' disabled':''}>${S.busy?'Menyimpan…':'Simpan'}</button><button type="button" data-eact="batal"${S.busy?' disabled':''}>Batal</button>${S.aksi==='ubah'?`<button type="button" class="dng" data-eact="hapus" style="margin-left:auto"${S.busy?' disabled':''}>Hapus Baris</button>`:''}</div>`}
function paint(){$('edmsg').innerHTML=esc(S.msg||'')+(S.dup?' <button type="button" data-eact="paksa">Tetap simpan</button>':'');$('edfoot').innerHTML=foot()}

/* kirim ke server */
function res(r){const s=S;if(!s||s.v!=='form')return;s.busy=false;
 if(r&&r.ok){close();toast(r.pesan||'Tersimpan.');loadData();return}
 if(r&&r.kode==='pin'){UP.pin='';try{sessionStorage.removeItem('agl-pin')}catch(x){}EDIT=false;close();render();toast('Kata sandi tidak valid. Aktifkan Mode Edit lagi.');return}
 s.hapus=false;s.msg=(r&&r.pesan)||'Gagal menyimpan.';s.dup=!!(r&&r.kode==='duplikat');if(r&&r.kode==='berubah')loadData();paint()}
function call(p){S.busy=true;S.msg='';S.dup=false;paint();
 google.script.run.withSuccessHandler(res).withFailureHandler(e=>{if(!S)return;S.busy=false;S.hapus=false;S.msg='Gagal menghubungi server: '+((e&&e.message)||e);paint()}).aglEditSimpan(UP.pin,S.j,p)}
function save(paksa){
 if(S.busy)return;const F=FLD[S.j],baru=[];let neg=false;
 for(let c=0;c<9;c++){const f=F[c],v=val(c).trim();
  if(S.aksi==='ubah'&&v===S.init[c]){baru.push(S.asli[c]);continue}   // kolom yang tidak disentuh dikirim apa adanya
  if(f.ty==='date'){if(!v){S.msg='Pilih tanggal.';return paint()}const d=v.split('-');baru.push(pad(d[2])+' '+SH[d[1]-1]+' '+d[0])}
  else if(f.ty==='text')baru.push(v);
  else{if(v!==''&&!/\d/.test(v)){S.msg='Kolom "'+f.l+'" harus berupa angka.';return paint()}const k=v===''?'':num(v);if(k<0)neg=true;baru.push(String(k))}}
 if(neg&&!paksa){S.msg='Ada angka negatif. Pastikan ini benar.';S.dup=true;return paint()}
 call({aksi:S.aksi,baris:S.row,asli:S.asli,baru,paksa:!!paksa})}

/* event */
m.addEventListener('input',e=>{if(!S||S.v!=='form'||!/^ed\d$/.test(e.target.id))return;const c=+e.target.id.slice(2),f=FLD[S.j][c];
 if(f.a)S.auto[f.a]=false;   // diketik manual -> berhenti otomatis
 if(S.msg||S.dup){S.msg='';S.dup=false;paint()}recalc()});
m.addEventListener('click',e=>{const t=e.target.closest('[data-eact],[data-eauto]');if(!t||!S)return;
 if(t.dataset.eauto){S.auto[t.dataset.eauto]=true;return recalc()}
 const a=t.dataset.eact;
 if(a==='batal'){if(!S.busy)close()}
 else if(a==='pinok')pinGo();
 else if(a==='simpan')save(false);
 else if(a==='paksa')save(true);
 else if(a==='hapus'){S.hapus=true;S.msg='';S.dup=false;paint()}
 else if(a==='hapusno'){S.hapus=false;paint()}
 else if(a==='hapusya'){if(!S.busy)call({aksi:'hapus',baris:S.row,asli:S.asli})}});
m.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='edpw')pinGo()});
m.addEventListener('click',e=>{if(e.target===m&&S&&S.v==='pin'&&!S.busy)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S&&!S.busy)close()});
$('app').addEventListener('click',e=>{
 const tb=e.target.closest('[data-tab]');if(tb){TAB=tb.dataset.tab;qs='';lim=100;render();return}
 if(e.target.closest('[data-etog]')){if(EDIT){EDIT=false;render()}else if(UP.pin){EDIT=true;render()}else openPin();return}
 if(e.target.closest('[data-eadd]')){openForm('tambah');return}
 const tr=e.target.closest('tr[data-er]');if(tr&&EDIT)openForm('ubah',+tr.dataset.er)});
})();
